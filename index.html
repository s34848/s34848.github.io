<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio | อิงฟ้า</title>

    <!-- Google Font : Itim -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Itim", cursive;
            min-height: 100vh;
            color: #31516b;

            background:
                linear-gradient(
                    135deg,
                    #eaf8ff 0%,
                    #cfeeff 35%,
                    #a9d9f5 65%,
                    #79b9df 100%
                );

            display: flex;
            flex-direction: column;
        }

        /* ===== Navigation ===== */

        nav {
            width: 100%;
            padding: 18px 7%;

            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(10px);

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow: 0 3px 15px rgba(70, 130, 170, 0.15);
        }

        .logo {
            font-size: 28px;
            color: #3c7fa8;
        }

        .menu {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .menu a {
            text-decoration: none;
            color: #416b85;
            font-size: 18px;
            transition: 0.3s;
        }

        .menu a:hover {
            color: #2373a5;
        }

        /* ===== Main ===== */

        main {
            flex: 1;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 70px 20px;
        }

        .home-card {
            width: 90%;
            max-width: 900px;

            padding: 55px 45px;

            background: rgba(255, 255, 255, 0.78);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 30px;

            text-align: center;

            box-shadow:
                0 15px 40px rgba(53, 112, 150, 0.18);

            backdrop-filter: blur(8px);
        }

        .small-title {
            font-size: 22px;
            color: #659bbd;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 52px;
            color: #32749c;
            margin-bottom: 5px;
        }

        .nickname {
            font-size: 30px;
            color: #5c91b0;
            margin-bottom: 25px;
        }

        .school {
            font-size: 22px;
            color: #476d84;
            margin-bottom: 30px;
        }

        .line {
            width: 80px;
            height: 4px;
            margin: 0 auto 28px;

            background: linear-gradient(
                to right,
                #b8e4f8,
                #5b9fc5
            );

            border-radius: 10px;
        }

        .description {
            max-width: 700px;
            margin: auto;

            font-size: 20px;
            line-height: 1.8;

            color: #526f82;
        }

        .enter-button {
            display: inline-block;

            margin-top: 35px;
            padding: 12px 35px;

            background: linear-gradient(
                135deg,
                #9ed7f1,
                #579ac3
            );

            color: white;
            text-decoration: none;

            font-size: 20px;

            border-radius: 30px;

            box-shadow: 0 7px 18px rgba(65, 135, 175, 0.25);

            transition: 0.3s;
        }

        .enter-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 22px rgba(65, 135, 175, 0.32);
        }

        /* ===== Footer ===== */

        footer {
            text-align: center;
            padding: 18px;

            background: rgba(255, 255, 255, 0.55);

            color: #5b7b8f;
            font-size: 16px;
        }

        /* ===== Responsive ===== */

        @media (max-width: 700px) {

            nav {
                flex-direction: column;
                gap: 10px;
            }

            .menu {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }

            h1 {
                font-size: 38px;
            }

            .nickname {
                font-size: 25px;
            }

            .description {
                font-size: 18px;
            }

            .home-card {
                padding: 40px 25px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav>

        <div class="logo">
            Portfolio
        </div>

        <ul class="menu">
            <li><a href="index.html">หน้าแรก</a></li>
            <li><a href="preface.html">คำนำ</a></li>
            <li><a href="profile.html">ประวัติส่วนตัว</a></li>
        </ul>

    </nav>


    <!-- Home -->
    <main>

        <section class="home-card">

            <p class="small-title">
                PORTFOLIO
            </p>

            <h1>
                นางสาวภลดา แสนศรี
            </h1>

            <p class="nickname">
                อิงฟ้า
            </p>

            <div class="line"></div>

            <p class="school">
                โรงเรียนบ้านบึง"อุตสาหกรรมนุเคราะห์"
            </p>

            <p class="description">
                เว็บไซต์นี้จะทำขึ้นเพื่อนำเสนอตัวตน ผลงานที่ผ่านมา
                ตลอดจนเป้าหมายการเรียนและการประกอบอาชีพในอนาคต
            </p>

            <a href="preface.html" class="enter-button">
                เข้าสู่ Portfolio
            </a>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        Portfolio ของนางสาวภลดา แสนศรี
    </footer>

</body>
</html>
